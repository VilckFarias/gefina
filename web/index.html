<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gefina</title>
</head>
<body>
    
    <div></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const container = document.querySelector('div');

    const root = ReactDOM.createRoot(container);

    const invoices = [{
      id: 1,
      amount: 100,
      status: "pending",
      issueDate: "2026-10-03",
      dueDate: "2026-11-05",
      customer: {
        id: 1,
        name: "Construtora Meridiano",
        email: "contato@meridiano.com.br"
      }
    },
    {
      id: 2,
      amount: 2642245,
      status: "pending",
      issueDate: "2026-08-02",
      dueDate: "2026-12-02",
      customer: {
        id: 2,
        name: "Telebras",
        email: "contato@telebras.com.br"
      }
    }, 
    {
      id: 3,
      amount: 10253256,
      status: "pending",
      issueDate: "2025-10-07",
      dueDate: "2025-10-07",
      customer: {
        id: 3,
        name: "Petobras",
        email: "contato@Petobras.com.br"
      }
    }
  ];

  function statusLabel(status) {
    return status === 'paid' ? 'Paga' : 'Pendente';
  }

    const Title = (props) => {
      return <h1>Faturas</h1>;
    };

    const TableRow = (props) => {
      return <tr>
        <td>{props.invoice.customer.name}</td>
        <td>{props.invoice.amount}</td>
        <td>{props.invoice.issueDate}</td>
        <td>{props.invoice.dueDate}</td>
        <td>{statusLabel(props.invoice.status)}</td>
      </tr>;
    }



    const Table = () => {
      return <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Valor</th>
            <th>Emissão</th>
            <th>Vencimento</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody>
          {invoices.map((invoice) => {
            return <TableRow 
              key={invoice.id} 
              invoice={invoice} 
            />;
          })}
        </tbody>
      </table>;
    };

    const App = () => {
      return <>
        <Title/>
        <Table/>
      </>
    }

    root.render(<App/>);
  </script>
</body>
</html>
